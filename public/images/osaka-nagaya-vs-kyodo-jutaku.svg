<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" font-family="Hiragino Sans, Yu Gothic, Meiryo, sans-serif" role="img" aria-label="長屋建と共同住宅の違いを示す図。長屋建は各戸が別々に外へ出入りし、共同住宅は廊下や階段を共用する">
<rect width="820" height="470" fill="#ffffff"/>
<text x="24" y="32" font-size="19" font-weight="bold" fill="#1a2b4c">「長屋建」と「共同住宅（文化住宅の多く）」はここで分かれます</text>
<text x="24" y="55" font-size="13" fill="#5a6b84">分かれ目は出入口。廊下・階段を共用しているかどうかで、統計上も建築基準法上も扱いが変わります。</text>

<rect x="24" y="76" width="376" height="300" fill="#f4f7fb" stroke="#c9d6e5" rx="8"/>
<text x="44" y="104" font-size="16" font-weight="bold" fill="#1a56db">長屋建（連棟式建物）</text>
<text x="44" y="126" font-size="12.5" fill="#3d5673">各戸が壁を共有し、それぞれ別々に外へ出入りする</text>

<rect x="52" y="150" width="320" height="96" fill="#ffffff" stroke="#7f9db9" stroke-width="1.5"/>
<line x1="132" y1="150" x2="132" y2="246" stroke="#1a56db" stroke-width="2.5"/>
<line x1="212" y1="150" x2="212" y2="246" stroke="#1a56db" stroke-width="2.5"/>
<line x1="292" y1="150" x2="292" y2="246" stroke="#1a56db" stroke-width="2.5"/>
<rect x="80" y="212" width="24" height="34" fill="#1a56db"/>
<rect x="160" y="212" width="24" height="34" fill="#1a56db"/>
<rect x="240" y="212" width="24" height="34" fill="#1a56db"/>
<rect x="320" y="212" width="24" height="34" fill="#1a56db"/>
<text x="212" y="272" font-size="12" fill="#3d5673" text-anchor="middle">▲ 各戸に専用の玄関（青）／青の縦線＝共有の壁</text>

<text x="52" y="302" font-size="12.5" fill="#243b53">・建築基準法2条2号の特殊建築物には<tspan font-weight="bold">当たりません</tspan></text>
<text x="52" y="324" font-size="12.5" fill="#243b53">・大阪市の除却補助には<tspan font-weight="bold">「長屋等の一部解体」の限度額</tspan>が別にあります</text>
<text x="52" y="346" font-size="12.5" fill="#243b53">・壁を壊す切り離しには<tspan font-weight="bold">隣戸所有者の同意</tspan>が要ります</text>

<rect x="420" y="76" width="376" height="300" fill="#fbf5f0" stroke="#e8cdb8" rx="8"/>
<text x="440" y="104" font-size="16" font-weight="bold" fill="#c2410c">共同住宅（文化住宅の多く）</text>
<text x="440" y="126" font-size="12.5" fill="#6b4b32">廊下・階段を共用する、または住宅を上下に重ねたもの</text>

<rect x="448" y="150" width="320" height="96" fill="#ffffff" stroke="#b9997f" stroke-width="1.5"/>
<line x1="448" y1="198" x2="768" y2="198" stroke="#b9997f" stroke-width="1.5"/>
<rect x="448" y="176" width="320" height="22" fill="#fde6d3"/>
<text x="608" y="192" font-size="11.5" fill="#8a5a35" text-anchor="middle">2階の共用廊下</text>
<path d="M 470 246 L 470 176 L 490 176" fill="none" stroke="#c2410c" stroke-width="3"/>
<text x="500" y="170" font-size="11.5" fill="#c2410c">◀ 外階段（共用）</text>
<rect x="530" y="176" width="20" height="22" fill="#c2410c"/>
<rect x="600" y="176" width="20" height="22" fill="#c2410c"/>
<rect x="670" y="176" width="20" height="22" fill="#c2410c"/>
<rect x="530" y="212" width="20" height="34" fill="#c2410c"/>
<rect x="600" y="212" width="20" height="34" fill="#c2410c"/>
<rect x="670" y="212" width="20" height="34" fill="#c2410c"/>
<text x="608" y="272" font-size="12" fill="#6b4b32" text-anchor="middle">▲ 階段と廊下を全戸で共用（茶＝各戸の玄関）</text>

<text x="448" y="302" font-size="12.5" fill="#3d2a1c">・建築基準法2条2号の<tspan font-weight="bold">特殊建築物に当たります</tspan></text>
<text x="448" y="324" font-size="12.5" fill="#3d2a1c">・補助の区分（戸建住宅／集合住宅）は<tspan font-weight="bold">事前相談での確認</tspan>が必要です</text>
<text x="448" y="346" font-size="12.5" fill="#3d2a1c">・1棟まるごとが1個の建物。1戸だけ切り離す発想が使えません</text>

<rect x="24" y="392" width="772" height="58" fill="#eef3f9" stroke="#c9d6e5" rx="6"/>
<text x="44" y="416" font-size="13" fill="#1a2b4c"><tspan font-weight="bold">「文化住宅」は法律用語でも統計用語でもありません。</tspan>大阪で昭和30〜40年代に多く建てられた木造2階建て賃貸住宅の通称です。</text>
<text x="44" y="438" font-size="13" fill="#1a2b4c">同じ「文化住宅」でも、出入口の形によって長屋建になる建物と共同住宅になる建物の両方があります。区分は登記事項証明書と現況でご確認ください。</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="人の死の告知に関するガイドラインにおける告知義務の起算日と期間の図">
<rect width="900" height="470" fill="#ffffff"/>
<text x="24" y="38" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="21" font-weight="bold" fill="#1a2b4c">告知義務の「概ね3年」はいつから数えるのか</text>
<text x="24" y="63" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="13" fill="#5a6b85">国土交通省「宅地建物取引業者による人の死の告知に関するガイドライン」（令和3年10月）の考え方を図にしたもの</text>

<line x1="60" y1="150" x2="840" y2="150" stroke="#c9d3e2" stroke-width="3"/>

<circle cx="140" cy="150" r="9" fill="#8895a8"/>
<line x1="140" y1="150" x2="140" y2="112" stroke="#8895a8" stroke-width="2"/>
<text x="140" y="104" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="14" font-weight="bold" fill="#3d4c63">死亡</text>
<text x="140" y="176" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="12" fill="#8895a8">推定される死亡日</text>
<text x="140" y="193" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="12" fill="#8895a8">（ここは起算日ではない）</text>

<path d="M175 150 L295 150" stroke="#e0a800" stroke-width="3" stroke-dasharray="6 5"/>
<text x="235" y="138" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="12" fill="#a67c00">発見までの期間</text>

<circle cx="330" cy="150" r="12" fill="#c0392b"/>
<line x1="330" y1="150" x2="330" y2="106" stroke="#c0392b" stroke-width="2"/>
<text x="330" y="98" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="15" font-weight="bold" fill="#c0392b">発覚（発見）</text>
<text x="330" y="176" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="13" font-weight="bold" fill="#c0392b">起算日はここ</text>
<text x="330" y="194" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="12" fill="#7a4a44">特殊清掃等が行われた場合は</text>
<text x="330" y="211" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="12" fill="#7a4a44">その死が「発覚した時期」から</text>

<rect x="330" y="250" width="330" height="52" rx="6" fill="#eaf2fb" stroke="#3d6fb4"/>
<text x="345" y="272" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="14" font-weight="bold" fill="#1c4a86">賃貸借取引：発覚から概ね3年</text>
<text x="345" y="292" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="12" fill="#3d6fb4">経過後は原則として借主に告げなくてもよい</text>
<line x1="660" y1="276" x2="700" y2="276" stroke="#3d6fb4" stroke-width="2"/>
<polygon points="700,270 714,276 700,282" fill="#3d6fb4"/>
<text x="722" y="281" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="12" fill="#3d6fb4">終わる</text>

<rect x="330" y="320" width="510" height="52" rx="6" fill="#fdeeee" stroke="#c0392b"/>
<text x="345" y="342" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="14" font-weight="bold" fill="#a02b1f">売買取引：経過期間の定めがない</text>
<text x="345" y="362" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="12" fill="#c0392b">ガイドラインに「◯年で告げなくてよい」という基準は書かれていない</text>
<text x="820" y="347" text-anchor="end" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="20" fill="#c0392b">→</text>

<rect x="24" y="398" width="852" height="54" rx="6" fill="#f6f8fb" stroke="#c9d3e2"/>
<text x="40" y="420" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="13" fill="#3d4c63">・自然死や日常生活の中での不慮の死（入浴中の転倒、食事中の誤嚥など）は、賃貸・売買いずれも原則として告げなくてよい</text>
<text x="40" y="440" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="13" fill="#3d4c63">・ただし長期間人知れず放置され、特殊清掃等が行われた場合はこの図の扱いになる。また買主から問われた場合は期間に関わらず告げる必要がある</text>
</svg>

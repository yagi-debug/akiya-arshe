<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-label="疎遠な親族の相続に関する通知を差出人別に5類型へ分け、それぞれの通知の正体と最初にすべきことを示した一覧図">
<rect width="900" height="620" fill="#ffffff"/>
<text x="24" y="36" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="21" font-weight="bold" fill="#1a2b4c">差出人で見分ける — 届いた通知の正体と、最初の一手</text>
<text x="24" y="60" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="13" fill="#5a6b85">封筒の差出人欄を見るだけで、急ぎ度と次にやることが決まります（民法915条の3か月は、どの類型でも同時に進みます）</text>

<rect x="24" y="80" width="200" height="34" rx="4" fill="#1a2b4c"/>
<text x="124" y="103" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">差出人</text>
<rect x="228" y="80" width="330" height="34" rx="4" fill="#1a2b4c"/>
<text x="393" y="103" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">通知の正体</text>
<rect x="562" y="80" width="314" height="34" rx="4" fill="#1a2b4c"/>
<text x="719" y="103" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">最初にやること</text>

<rect x="24" y="118" width="200" height="90" rx="4" fill="#f6f8fb" stroke="#8895a8"/>
<text x="40" y="146" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="14" font-weight="bold" fill="#1a2b4c">司法書士・弁護士</text>
<text x="40" y="168" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="12" fill="#5a6b85">「相続人調査の件」</text>
<text x="40" y="186" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="12" fill="#5a6b85">「遺産分割のご協力」</text>
<rect x="228" y="118" width="330" height="90" rx="4" fill="#f6f8fb" stroke="#8895a8"/>
<text x="244" y="146" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="13" fill="#3d4c63">他の相続人が依頼した代理人からの連絡。</text>
<text x="244" y="167" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="13" fill="#3d4c63">あなたの署名・押印が必要な場面が控えて</text>
<text x="244" y="188" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="13" fill="#3d4c63">います。あなたの味方ではありません。</text>
<rect x="562" y="118" width="314" height="90" rx="4" fill="#eaf7ee" stroke="#2e7d4f" stroke-width="2"/>
<text x="578" y="146" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="13" font-weight="bold" fill="#1f5c39">まず財産目録を送ってもらう</text>
<text x="578" y="168" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="12" fill="#2e7d4f">署名は財産と負債を見てから。</text>
<text x="578" y="188" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="12" fill="#2e7d4f">受け取った日付を必ず控える。</text>

<rect x="24" y="212" width="200" height="90" rx="4" fill="#f6f8fb" stroke="#8895a8"/>
<text x="40" y="240" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="14" font-weight="bold" fill="#1a2b4c">家庭裁判所</text>
<text x="40" y="262" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="12" fill="#5a6b85">調停期日の呼出状</text>
<text x="40" y="280" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="12" fill="#5a6b85">照会書・回答書</text>
<rect x="228" y="212" width="330" height="90" rx="4" fill="#f6f8fb" stroke="#8895a8"/>
<text x="244" y="240" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="13" fill="#3d4c63">遺産分割調停がすでに申し立てられ、</text>
<text x="244" y="261" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="13" fill="#3d4c63">あなたが当事者に含まれている状態。</text>
<text x="244" y="282" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="13" fill="#3d4c63">期日と回答期限が決まっています。</text>
<rect x="562" y="212" width="314" height="90" rx="4" fill="#fdeaea" stroke="#c0392b" stroke-width="2"/>
<text x="578" y="240" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="13" font-weight="bold" fill="#a03027">放置しない・期限を最優先</text>
<text x="578" y="262" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="12" fill="#c0392b">欠席しても手続きは進みます。</text>
<text x="578" y="282" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="12" fill="#c0392b">弁護士へ早めに相談を。</text>

<rect x="24" y="306" width="200" height="90" rx="4" fill="#f6f8fb" stroke="#8895a8"/>
<text x="40" y="334" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="14" font-weight="bold" fill="#1a2b4c">債権者・サービサー</text>
<text x="40" y="356" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="12" fill="#5a6b85">「相続人各位」宛の</text>
<text x="40" y="374" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="12" fill="#5a6b85">請求書・受任通知</text>
<rect x="228" y="306" width="330" height="90" rx="4" fill="#f6f8fb" stroke="#8895a8"/>
<text x="244" y="334" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="13" fill="#3d4c63">故人に借金が残っている合図。もっとも</text>
<text x="244" y="355" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="13" fill="#3d4c63">危険な類型で、支払ってしまうと相続を</text>
<text x="244" y="376" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="13" fill="#3d4c63">認めたと扱われるおそれがあります。</text>
<rect x="562" y="306" width="314" height="90" rx="4" fill="#fdeaea" stroke="#c0392b" stroke-width="2"/>
<text x="578" y="334" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="13" font-weight="bold" fill="#a03027">1円も払わない・何も処分しない</text>
<text x="578" y="356" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="12" fill="#c0392b">民法921条の法定単純承認に</text>
<text x="578" y="376" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="12" fill="#c0392b">あたるおそれ。先に専門家へ。</text>

<rect x="24" y="400" width="200" height="90" rx="4" fill="#f6f8fb" stroke="#8895a8"/>
<text x="40" y="428" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="14" font-weight="bold" fill="#1a2b4c">市区町村</text>
<text x="40" y="450" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="12" fill="#5a6b85">相続人代表者指定届</text>
<text x="40" y="468" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="12" fill="#5a6b85">固定資産税の納税通知</text>
<rect x="228" y="400" width="330" height="90" rx="4" fill="#f6f8fb" stroke="#8895a8"/>
<text x="244" y="428" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="13" fill="#3d4c63">故人名義の不動産があり、自治体が</text>
<text x="244" y="449" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="13" fill="#3d4c63">課税先を探している状態。土地や家屋が</text>
<text x="244" y="470" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="13" fill="#3d4c63">残っていることの、確実な手がかりです。</text>
<rect x="562" y="400" width="314" height="90" rx="4" fill="#eaf7ee" stroke="#2e7d4f" stroke-width="2"/>
<text x="578" y="428" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="13" font-weight="bold" fill="#1f5c39">名寄帳を取り寄せて全物件を把握</text>
<text x="578" y="450" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="12" fill="#2e7d4f">代表者に指定されても、相続を</text>
<text x="578" y="470" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="12" fill="#2e7d4f">認めたことにはなりません。</text>

<rect x="24" y="494" width="200" height="90" rx="4" fill="#f6f8fb" stroke="#8895a8"/>
<text x="40" y="522" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="14" font-weight="bold" fill="#1a2b4c">親族本人</text>
<text x="40" y="544" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="12" fill="#5a6b85">「相続放棄したので</text>
<text x="40" y="562" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="12" fill="#5a6b85">次はあなたです」</text>
<rect x="228" y="494" width="330" height="90" rx="4" fill="#f6f8fb" stroke="#8895a8"/>
<text x="244" y="522" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="13" fill="#3d4c63">先順位の相続人が放棄し、順位が回って</text>
<text x="244" y="543" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="13" fill="#3d4c63">きた合図。先順位が放棄する理由の多くは</text>
<text x="244" y="564" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="13" fill="#3d4c63">借金か、売れない不動産です。</text>
<rect x="562" y="494" width="314" height="90" rx="4" fill="#fff6e5" stroke="#b8860b" stroke-width="2"/>
<text x="578" y="522" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="13" font-weight="bold" fill="#8a6508">3か月はこの通知の日から数える</text>
<text x="578" y="544" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="12" fill="#b8860b">なぜ放棄したのかを聞き取る。</text>
<text x="578" y="564" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="12" fill="#b8860b">封筒と消印は捨てずに保管。</text>

<text x="24" y="606" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="11" fill="#8895a8">出典：民法915条・921条・939条（e-Gov法令検索）／裁判所「相続の放棄の申述」　作成：空き家のミカタ編集部</text>
</svg>

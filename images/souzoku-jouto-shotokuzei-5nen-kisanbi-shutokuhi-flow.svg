<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" role="img" aria-label="相続した不動産の取得費がわからないときに何を探し、見つからない場合に概算取得費5パーセントへ進むかを示したフローチャート">
  <style>
    text { font-family: "Hiragino Sans", "Yu Gothic", sans-serif; fill: #1f2937; }
    .ttl { font-size: 22px; font-weight: bold; }
    .h { font-size: 16px; font-weight: bold; }
    .b { font-size: 14px; }
    .s { font-size: 12.5px; fill: #4b5563; }
  </style>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="700" fill="#ffffff"/>
  <text class="ttl" x="450" y="36" text-anchor="middle">取得費がわからないときに、捨てる前に探す順番</text>
  <text class="s" x="450" y="58" text-anchor="middle">実額が1円でも証明できれば、概算取得費5%より税額が下がることがあります</text>

  <rect x="250" y="80" width="400" height="52" rx="8" fill="#1a56db"/>
  <text class="h" x="450" y="112" text-anchor="middle" fill="#ffffff">被相続人の購入時の売買契約書はありますか</text>
  <line x1="450" y1="132" x2="450" y2="146" stroke="#94a3b8" stroke-width="2"/>
  <line x1="240" y1="146" x2="660" y2="146" stroke="#94a3b8" stroke-width="2"/>
  <line x1="240" y1="146" x2="240" y2="158" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="660" y1="146" x2="660" y2="158" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="60" y="162" width="360" height="66" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text class="h" x="240" y="190" text-anchor="middle" fill="#15803d">ある → 実額で計算</text>
  <text class="s" x="240" y="214" text-anchor="middle">建物は減価償却費相当額を差し引きます</text>

  <rect x="480" y="162" width="360" height="66" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text class="h" x="660" y="190" text-anchor="middle" fill="#c2410c">ない → 下の6つを家の中で探す</text>
  <text class="s" x="660" y="214" text-anchor="middle">捨てる前・解体前が最後の機会です</text>
  <line x1="660" y1="228" x2="660" y2="252" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="60" y="256" width="780" height="230" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text class="b" x="82" y="286">① 購入時の領収書・仲介手数料の領収書・登記費用の領収書</text>
  <text class="b" x="82" y="318">② 住宅ローンの金銭消費貸借契約書、返済予定表</text>
  <text class="b" x="82" y="350">③ 登記事項証明書の乙区に残る抵当権設定の債権額（借入額の手がかり）</text>
  <text class="b" x="82" y="382">④ 通帳・振込控え（購入時期の出金記録）</text>
  <text class="b" x="82" y="414">⑤ 分譲時のパンフレット・価格表・広告チラシ</text>
  <text class="b" x="82" y="446">⑥ 売主だった分譲会社・仲介会社に残る売買契約書の写し（現存する会社なら照会）</text>
  <line x1="450" y1="486" x2="450" y2="512" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="150" y="516" width="600" height="66" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text class="h" x="450" y="544" text-anchor="middle" fill="#b91c1c">どれも見つからない → 概算取得費（売却代金の5%）</text>
  <text class="s" x="450" y="568" text-anchor="middle">措法31条の4／措通31の4-1。3,000万円で売れば取得費は150万円</text>
  <line x1="450" y1="582" x2="450" y2="608" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="90" y="612" width="720" height="66" rx="8" fill="#eff6ff" stroke="#1a56db" stroke-width="2"/>
  <text class="h" x="450" y="640" text-anchor="middle" fill="#1e40af">最後に、控除の特例が使えないかを確認する</text>
  <text class="s" x="450" y="664" text-anchor="middle">取得費加算の特例（措法39条・約3年10か月以内）／相続空き家の3,000万円特別控除（措法35条3項）</text>
</svg>

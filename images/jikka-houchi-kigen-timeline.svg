<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="相続開始から効いてくる4つの期限の時系列図">
  <style>
    .t{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;fill:#1f2933}
    .ttl{font-size:22px;font-weight:700}
    .lbl{font-size:15px;font-weight:700}
    .sub{font-size:13px;fill:#52606d}
    .cap{font-size:12px;fill:#6b7280}
    .node{font-size:14px;font-weight:700;fill:#fff}
  </style>
  <rect width="900" height="470" fill="#fbfcfd"/>
  <text class="t ttl" x="30" y="42">相続で実家を引き継いだ日から、期限はこの順で切れていきます</text>
  <text class="t sub" x="30" y="66">「困っていない」期間にも、下の4本のカウントダウンは動いています</text>

  <line x1="60" y1="120" x2="850" y2="120" stroke="#cbd2d9" stroke-width="4" stroke-linecap="round"/>
  <polygon points="850,112 870,120 850,128" fill="#cbd2d9"/>

  <circle cx="80" cy="120" r="11" fill="#1a5632"/>
  <text class="t lbl" x="80" y="102" text-anchor="middle">相続開始</text>
  <text class="t cap" x="80" y="150" text-anchor="middle">0か月</text>

  <circle cx="260" cy="120" r="11" fill="#2b6cb0"/>
  <text class="t cap" x="260" y="150" text-anchor="middle">10か月</text>

  <circle cx="560" cy="120" r="11" fill="#b7791f"/>
  <text class="t cap" x="560" y="150" text-anchor="middle">3年</text>

  <circle cx="770" cy="120" r="11" fill="#9b2c2c"/>
  <text class="t cap" x="770" y="150" text-anchor="middle">3年10か月</text>

  <rect x="150" y="180" width="230" height="72" rx="8" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
  <text class="t lbl" x="165" y="205" fill="#2b6cb0">相続税の申告・納付</text>
  <text class="t sub" x="165" y="226">死亡を知った日の翌日から</text>
  <text class="t sub" x="165" y="244">10か月以内（かかる場合のみ）</text>
  <line x1="260" y1="133" x2="260" y2="180" stroke="#2b6cb0" stroke-width="2" stroke-dasharray="4 3"/>

  <rect x="410" y="180" width="255" height="72" rx="8" fill="#fffaf0" stroke="#b7791f" stroke-width="2"/>
  <text class="t lbl" x="425" y="205" fill="#b7791f">相続登記の申請義務</text>
  <text class="t sub" x="425" y="226">取得を知った日から3年以内</text>
  <text class="t sub" x="425" y="244">怠ると10万円以下の過料（不登法164条）</text>
  <line x1="560" y1="133" x2="560" y2="180" stroke="#b7791f" stroke-width="2" stroke-dasharray="4 3"/>

  <rect x="410" y="272" width="255" height="72" rx="8" fill="#f0fff4" stroke="#1a5632" stroke-width="2"/>
  <text class="t lbl" x="425" y="297" fill="#1a5632">空き家の3,000万円特別控除</text>
  <text class="t sub" x="425" y="318">相続開始から3年を経過する日の</text>
  <text class="t sub" x="425" y="336">属する年の12月31日までに売却</text>

  <rect x="600" y="364" width="270" height="72" rx="8" fill="#fff5f5" stroke="#9b2c2c" stroke-width="2"/>
  <text class="t lbl" x="615" y="389" fill="#9b2c2c">取得費加算の特例</text>
  <text class="t sub" x="615" y="410">相続税の申告期限の翌日以後</text>
  <text class="t sub" x="615" y="428">3年を経過する日までに譲渡</text>
  <line x1="770" y1="133" x2="770" y2="364" stroke="#9b2c2c" stroke-width="2" stroke-dasharray="4 3"/>

  <text class="t cap" x="30" y="460">出典: 不動産登記法第76条の2・第164条／国税庁タックスアンサーNo.3306・No.3267　作成: 空き家のミカタ編集部</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" width="860" height="620" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" role="img" aria-label="数次相続の登記を1件の申請にまとめられるかどうかを判定するフロー図。中間の相続で権利を取得した人が1人なら1件、複数なら2件になる">
  <rect width="860" height="620" fill="#f8fafc"/>
  <text x="430" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">「まとめて1件」にできるかは、途中の代の人数で決まります</text>

  <rect x="180" y="58" width="500" height="62" rx="10" fill="#fff" stroke="#1a56db" stroke-width="2"/>
  <text x="430" y="84" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a56db">祖父が亡くなり、登記しないうちに父も亡くなった</text>
  <text x="430" y="107" text-anchor="middle" font-size="14" fill="#334155">＝数次相続（相続が2回以上重なっている状態）</text>

  <path d="M430 120 L430 152" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0 0 L8 5 L0 10 z" fill="#94a3b8"/></marker></defs>

  <rect x="150" y="152" width="560" height="70" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="430" y="180" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400e">最後の代を除いた「途中の代」で、</text>
  <text x="430" y="205" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400e">その不動産の権利を取得した人は何人ですか？</text>

  <path d="M300 222 L200 262" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <path d="M560 222 L660 262" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- 左：1人 -->
  <rect x="24" y="266" width="390" height="250" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <rect x="24" y="266" width="390" height="46" rx="12" fill="#16a34a"/>
  <rect x="24" y="300" width="390" height="12" fill="#16a34a"/>
  <text x="219" y="297" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">1人だけ（単独で取得）</text>
  <g font-size="14.5" fill="#1f2937">
    <text x="44" y="336" font-weight="bold" fill="#15803d">→ 1件の申請でまとめられます</text>
    <text x="44" y="362">・遺産分割協議で父が1人で取得した</text>
    <text x="44" y="384">・他の相続人が相続放棄をした</text>
    <text x="44" y="406">・もともと相続人が父1人だった</text>
    <text x="44" y="436" font-weight="bold" fill="#15803d">登録免許税は1回分（評価額×0.4%）</text>
    <text x="44" y="462">法務局の様式「所有権移転登記申請書</text>
    <text x="44" y="484">（相続・遺産分割）（数次相続）」を使います</text>
  </g>

  <!-- 右：2人以上 -->
  <rect x="446" y="266" width="390" height="250" rx="12" fill="#fff" stroke="#dc2626" stroke-width="2"/>
  <rect x="446" y="266" width="390" height="46" rx="12" fill="#dc2626"/>
  <rect x="446" y="300" width="390" height="12" fill="#dc2626"/>
  <text x="641" y="297" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">2人以上（共同で取得）</text>
  <g font-size="14.5" fill="#1f2937">
    <text x="466" y="336" font-weight="bold" fill="#b91c1c">→ 1件にはできません。2件に分けます</text>
    <text x="466" y="362">・父と叔父の2人が法定相続分で取得した</text>
    <text x="466" y="384">・途中の代で誰が取るか決まっていない</text>
    <text x="466" y="414" font-weight="bold" fill="#b91c1c">1件目：祖父 → 父・叔父</text>
    <text x="466" y="436" font-weight="bold" fill="#b91c1c">2件目：父の持分 → 最終の相続人</text>
    <text x="466" y="466">1件目の土地のうち亡くなった方の持分は、</text>
    <text x="466" y="488">2027年3月31日まで登録免許税が免税です</text>
  </g>

  <rect x="24" y="532" width="812" height="66" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="44" y="558" font-size="14.5" fill="#1e3a8a">法務局の記載例にはこう書かれています：「最終の相続以外の相続について、共同相続人数名が</text>
  <text x="44" y="581" font-size="14.5" fill="#1e3a8a">権利を取得している場合には、一件の申請では登記することができません。」</text>
</svg>

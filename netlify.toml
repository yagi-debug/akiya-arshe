[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/guide/osaka-wakeare-buyer-5sha-hikaku"
  to = "/guide/osaka-wakeare-buyer-4sha-hikaku"
  status = 301
  force = true

[[redirects]]
  from = "/guide/osaka-wakeare-buyer-5sha-hikaku/"
  to = "/guide/osaka-wakeare-buyer-4sha-hikaku/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "index, follow"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # AI クローラー向け: キャッシュを短めにして最新コンテンツを認識させる
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/sitemap*.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
